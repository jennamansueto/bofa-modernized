services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: olb
      POSTGRES_USER: olb
      POSTGRES_PASSWORD: olb
    ports:
      - "5432:5432"
    volumes:
      - olb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olb -d olb"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/olb
      SPRING_DATASOURCE_USERNAME: olb
      SPRING_DATASOURCE_PASSWORD: olb
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      # Demo knobs (optional): pin "now" so cutoff/holiday scenarios are reproducible.
      OLB_FIXED_NOW: ${OLB_FIXED_NOW:-}
      OLB_TEST_CLOCK_ENABLED: ${OLB_TEST_CLOCK_ENABLED:-false}
      OLB_CORS_ALLOWED_ORIGINS: ${OLB_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8080:8080"

volumes:
  olb-pgdata:
